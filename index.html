<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Διάλεξε Βίντεο</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    header {
      text-align: center;
    }
    header h1 {
      font-size: 1.6rem;
      margin-bottom: 0.4rem;
    }
    header p {
      color: #94a3b8;
      font-size: 0.95rem;
    }
    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }
    .tab-btn {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 0.85rem 1rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .tab-btn:hover {
      border-color: #64748b;
    }
    .tab-btn.active {
      background: #2563eb;
      color: #ffffff;
      border-color: #3b82f6;
    }
    .player-card {
      background: #1e293b;
      border-radius: 12px;
      padding: 1.2rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }
    video {
      width: 100%;
      max-height: 70vh;
      border-radius: 8px;
      display: block;
      background: #000;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Διάλεξε Βίντεο</h1>
      <p>Πάτησε ένα από τα δύο κουμπιά για εναλλαγή</p>
    </header>

    <div class="tabs" role="tablist">
      <button class="tab-btn active" onclick="selectVideo(0)">1. Πρώτο Βίντεο</button>
      <button class="tab-btn" onclick="selectVideo(1)">2. Δεύτερο Βίντεο</button>
    </div>

    <div class="player-card">
      <video id="mp4-player" controls preload="metadata" playsinline>
        <source id="mp4-source" src="video1.mp4" type="video/mp4">
        Ο browser σας δεν υποστηρίζει αναπαραγωγή βίντεο.
      </video>
    </div>
  </div>

  <script>
    const mp4Files = [
      "video1.mp4",
      "video2.mp4"
    ];

    function selectVideo(index) {
      const video = document.getElementById("mp4-player");
      const source = document.getElementById("mp4-source");
      const buttons = document.querySelectorAll(".tab-btn");

      source.src = mp4Files[index];
      video.load();

      buttons.forEach((btn, i) => {
        btn.classList.toggle("active", i === index);
      });
    }
  </script>

</body>
</html>
